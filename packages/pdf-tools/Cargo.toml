[package]
name = "pdf-tools"
version = "0.1.0"
authors = ["Aaron Turner <aaron@aaronthedev.com>"]
edition = "2018"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
pdfium-render = "0.8.25"
js-sys = "^0"
log = "^0"
wasm-bindgen-futures = "^0"
web-sys = { version = "^0", features = ["ImageData"] }
base64 = "0.21"
image = { version = "0.25.2", default-features = false }
serde_json = "1.0.128"


